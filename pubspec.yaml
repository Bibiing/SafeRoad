name: saferoad
description: "SafeRoad — Aplikasi pelaporan kerusakan jalan & fasilitas publik."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.2

  # State management
  provider: ^6.1.2

  # Maps & lokasi
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Foto
  image_picker: ^1.1.2

  # Tipografi
  google_fonts: ^6.2.1

  # Format tanggal & angka
  intl: ^0.19.0

  # Animasi
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2

  # App icon & splash generator
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── App Launcher Icon ─────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-saferoad.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo-saferoad.png"
  web:
    generate: false

# ── Native Splash Screen ──────────────────────────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo-saferoad.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo-saferoad.png
    icon_background_color: "#FFFFFF"
